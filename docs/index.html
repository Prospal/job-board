<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Job Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171f; --muted: #626b7a; --line: #e3e6eb;
  --accent: #0f766e; --accent-soft: #e6f4f2; --warn: #b45309; --warn-soft: #fdf3e4;
  --bad: #b42318; --bad-soft: #fdecea; --chip: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1116; --panel: #161a21; --ink: #e8ebf0; --muted: #929aa8; --line: #262c36;
    --accent: #2dd4bf; --accent-soft: #123331; --warn: #f5a524; --warn-soft: #33260f;
    --bad: #f97066; --bad-soft: #3a1714; --chip: #202631;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1116; --panel: #161a21; --ink: #e8ebf0; --muted: #929aa8; --line: #262c36;
  --accent: #2dd4bf; --accent-soft: #123331; --warn: #f5a524; --warn-soft: #33260f;
  --bad: #f97066; --bad-soft: #3a1714; --chip: #202631;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, system-ui, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font-size: 24px; margin: 0; letter-spacing: -0.02em; }
.sub { color: var(--muted); font-size: 13px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 12px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 14px; }
input[type=search], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; }
input[type=search] { flex: 1 1 220px; }
label.tog { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.list { display: grid; gap: 8px; }
.job { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: start; }
.job.dim { opacity: .5; }
.score { font: 500 15px 'JetBrains Mono', monospace; text-align: center; border-radius: 8px; padding: 6px 0; background: var(--chip); }
.score.hi { background: var(--accent-soft); color: var(--accent); }
.title { font-weight: 600; font-size: 15px; color: var(--ink); text-decoration: none; }
.title:hover { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; margin: 2px 0 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.chip.good { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.desc { color: var(--muted); font-size: 12.5px; margin-top: 6px; display: none; }
.job.open .desc { display: block; }
.side { display: flex; flex-direction: column; gap: 6px; align-items: stretch; min-width: 120px; }
.btn { font: 600 13px Inter, sans-serif; text-align: center; text-decoration: none; background: var(--accent); color: var(--panel); border-radius: 7px; padding: 7px 12px; }
.more { background: none; border: 0; color: var(--muted); font: inherit; font-size: 12px; cursor: pointer; padding: 0; margin-top: 4px; }
.empty { text-align: center; color: var(--muted); padding: 40px; }
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login form { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; width: min(360px, 100%); display: grid; gap: 12px; }
.login h1 { font-size: 20px; }
.login input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; }
.login button { font: 600 14px Inter, sans-serif; background: var(--accent); color: var(--panel); border: 0; border-radius: 7px; padding: 10px; cursor: pointer; }
.login .err { color: var(--bad); font-size: 13px; min-height: 18px; }
.links { display: flex; gap: 14px; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--muted); font: inherit; font-size: 13px; text-decoration: underline; cursor: pointer; padding: 0; }
[hidden] { display: none !important; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tab { font: 600 14px Inter, sans-serif; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 14px; cursor: pointer; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { display: grid; gap: 14px; }
.panel > .sub { margin: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card .sub { margin: -4px 0 10px; }
.panel h3, .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 10px; }
.sk-h { margin: 6px 0 0 !important; }
.sk-top { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: start; }
.sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.skrow { display: grid; grid-template-columns: minmax(110px, 170px) 1fr 44px; gap: 10px; align-items: center; width: 100%;
  background: none; border: 0; padding: 5px 4px; border-radius: 6px; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.skrow:hover { background: var(--chip); }
.skname { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.skname .have { color: var(--accent); font-weight: 600; margin-left: 4px; font-size: 12px; }
.bar { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.skpct { font: 500 12px 'JetBrains Mono', monospace; color: var(--muted); text-align: right; }
@media (max-width: 760px) { .sk-top { grid-template-columns: 1fr; } }
.cov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.cty { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; cursor: pointer; background: var(--bg); text-align: left; font: inherit; color: var(--ink); }
.cty:hover { border-color: var(--accent); }
.cty.zero { opacity: .55; }
.cty-top { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
.cty-top b { font: 500 15px 'JetBrains Mono', monospace; }
.cty .chips { margin-top: 6px; }
.src-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.src-table td, .src-table th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.src-table th { color: var(--muted); font-weight: 500; font-size: 12px; }
.src-table td.num { font-family: 'JetBrains Mono', monospace; text-align: right; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.dot.ok { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
@media (max-width: 640px) {
  .job { grid-template-columns: 1fr; }
  .score { width: 52px; }
  .side { flex-direction: row; }
  .side > * { flex: 1; }
}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <h1>Security Job Board</h1>
    <div class="sub">Enter the dashboard password.</div>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required autofocus>
    <label class="tog"><input type="checkbox" id="remember"> Remember on this device</label>
    <button type="submit" id="unlockBtn">Unlock</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div>
      <h1>Security Job Board</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="links">
      <button class="linkbtn" id="csvBtn">Download CSV</button>
      <button class="linkbtn" id="logout">Log out</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="jobs" aria-selected="true">Jobs</button>
    <button class="tab" role="tab" data-tab="skills" aria-selected="false">Skills</button>
    <button class="tab" role="tab" data-tab="coverage" aria-selected="false">Coverage</button>
  </nav>

  <div class="filters" id="filters">
    <input type="search" id="q" placeholder="Search title, company, skills…">
    <select id="country"><option value="">All locations</option></select>
    <select id="work"><option value="">Remote + onsite</option><option value="remote">Remote</option><option value="onsite">Onsite</option></select>
    <select id="skill"><option value="">Any skill</option></select>
    <select id="status">
      <option value="">Any status</option><option value="new">New</option><option value="saved">Saved</option>
      <option value="applied">Applied</option><option value="interview">Interview</option>
      <option value="rejected">Rejected</option><option value="skip">Skipped</option>
    </select>
    <label class="tog"><input type="checkbox" id="reloc"> Relocation / visa only</label>
    <label class="tog"><input type="checkbox" id="hideRestricted" checked> Hide citizens-only &amp; no-sponsor</label>
    <label class="tog"><input type="checkbox" id="hideSkipped" checked> Hide skipped</label>
  </div>

  <section class="panel" id="panel-jobs"><div class="list" id="list"></div></section>

  <section class="panel" id="panel-skills" hidden>
    <p class="sub" id="skillsNote"></p>
    <div class="sk-top">
      <div class="card"><h3>Most requested</h3><div id="skTop"></div></div>
      <div class="card"><h3>Your biggest gaps</h3><p class="sub">Most requested skills that aren't in your <code>MY_SKILLS</code> list.</p><div id="skGaps"></div></div>
    </div>
    <h3 class="sk-h">By category</h3>
    <div class="sk-grid" id="skCats"></div>
  </section>

  <section class="panel" id="panel-coverage" hidden>
    <p class="sub" id="covSummary"></p>
    <div class="card"><h3>Countries (click to filter)</h3><div class="cov-grid" id="covCountries"></div></div>
    <div class="card"><h3>Sources, last run</h3><table class="src-table" id="covSources"></table></div>
  </section>
</div>

<script>
const STATUSES = ["new", "saved", "applied", "interview", "rejected", "skip"];
const KEY = "jobboard.status";
let jobs = [];
let statusMap = {};
try { statusMap = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
const saveStatus = () => { try { localStorage.setItem(KEY, JSON.stringify(statusMap)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const statusOf = j => statusMap[j.apply_url] || "new";
const place = j => j.work_type === "remote" ? "remote" : (j.target_country || "other");
const today = new Date().toISOString().slice(0, 10);

// ── Auth: data files are encrypted by the workflow with
// `openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt -base64`.
// The password only ever lives in this browser; a wrong password simply fails to decrypt.
const PW_KEY = "jobboard.pw";
const ITER = 200000;

async function decryptFile(path, password) {
  const r = await fetch(path, {cache: "no-store"});
  if (!r.ok) throw new Error("missing");
  const raw = Uint8Array.from(atob((await r.text()).trim()), c => c.charCodeAt(0));
  if (new TextDecoder().decode(raw.slice(0, 8)) !== "Salted__") throw new Error("bad file");
  const salt = raw.slice(8, 16), body = raw.slice(16);
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256"}, base, 384));
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-CBC", iv: bits.slice(32, 48)}, key, body);
  return new TextDecoder().decode(plain);
}

const storedPw = () => { try { return sessionStorage.getItem(PW_KEY) || localStorage.getItem(PW_KEY); } catch (e) { return null; } };

async function unlock(password, remember) {
  let data;
  try {
    data = JSON.parse(await decryptFile("jobs.json.enc", password));
  } catch (e) {
    throw new Error(e.message === "missing" ? "No data yet: run the scraper workflow once." : "Wrong password.");
  }
  try {
    sessionStorage.setItem(PW_KEY, password);
    if (remember) localStorage.setItem(PW_KEY, password);
  } catch (e) {}
  window.__pw = password;
  $("login").hidden = true;
  $("app").hidden = false;
  jobs = data.jobs || [];
  $("updated").textContent = `${jobs.length} jobs · updated ${new Date(data.generated).toLocaleString()}`;
  const places = [...new Set(jobs.map(place))].sort();
  $("country").innerHTML = `<option value="">All locations</option>` +
    places.map(p => `<option value="${esc(p)}">${esc(p[0].toUpperCase() + p.slice(1))}</option>`).join("");
  skillsMeta = data.skills || {categories: {}, mine: []};
  const counts = {};
  jobs.forEach(j => skillsOf(j).forEach(s => counts[s] = (counts[s] || 0) + 1));
  $("skill").innerHTML = `<option value="">Any skill</option>` + Object.entries(skillsMeta.categories).map(([cat, list]) =>
    `<optgroup label="${esc(cat)}">${list.filter(s => counts[s]).map(s =>
      `<option value="${esc(s)}">${esc(s)} (${counts[s]})</option>`).join("")}</optgroup>`).join("");
  renderCoverage(data.coverage || {});
  render();
}

// ── Tabs
let activeTab = "jobs";
let skillsMeta = {categories: {}, mine: []};
const skillsOf = j => j.skills ? j.skills.split(", ") : [];

function showTab(name) {
  activeTab = name;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === name));
  ["jobs", "skills", "coverage"].forEach(p => $("panel-" + p).hidden = p !== name);
  $("filters").hidden = name === "coverage";
  render();
}
document.querySelector(".tabs").addEventListener("click", e => {
  if (e.target.matches(".tab")) showTab(e.target.dataset.tab);
});

// ── Skills tab: share of jobs (matching the current filters) that ask for each skill.
function renderSkills(pool) {
  const described = pool.filter(j => j.has_description);
  const n = described.length;
  const cnt = {};
  described.forEach(j => skillsOf(j).forEach(s => cnt[s] = (cnt[s] || 0) + 1));
  const mine = new Set(skillsMeta.mine || []);
  const scopeNote = $("skill").value ? " (skill filter ignored here)" : "";
  $("skillsNote").textContent = n
    ? `Based on ${n} jobs with a full description, out of ${pool.length} matching your filters${scopeNote}. Click a skill to see its jobs.`
    : "No jobs with full descriptions match these filters yet.";

  const max = Math.max(1, ...Object.values(cnt));
  const row = s => {
    const pct = n ? Math.round(cnt[s] / n * 100) : 0;
    return `<button class="skrow" data-skill="${esc(s)}" title="${esc(s)}: ${cnt[s]} of ${n} jobs (${pct}%)">
      <span class="skname">${esc(s)}${mine.has(s) ? `<span class="have">✓ you</span>` : ""}</span>
      <span class="bar"><i style="width:${(cnt[s] / max * 100).toFixed(1)}%"></i></span>
      <span class="skpct">${pct}%</span></button>`;
  };
  const ranked = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
  $("skTop").innerHTML = ranked.slice(0, 15).map(row).join("") || `<p class="sub">Nothing yet.</p>`;
  const gaps = ranked.filter(s => !mine.has(s)).slice(0, 8);
  $("skGaps").innerHTML = gaps.map(row).join("") || `<p class="sub">No gaps: you list every top skill.</p>`;

  $("skCats").innerHTML = Object.entries(skillsMeta.categories)
    .map(([cat, list]) => [cat, list.filter(s => cnt[s]).sort((a, b) => cnt[b] - cnt[a])])
    .filter(([, list]) => list.length)
    .sort((a, b) => cnt[b[1][0]] - cnt[a[1][0]])
    .map(([cat, list]) => `<div class="card"><h3>${esc(cat)}</h3>${list.map(row).join("")}</div>`).join("");
}

$("panel-skills").addEventListener("click", e => {
  const btn = e.target.closest(".skrow");
  if (!btn) return;
  $("skill").value = btn.dataset.skill;
  showTab("jobs");
  window.scrollTo({top: 0, behavior: "smooth"});
});

const SOURCE_NAMES = {greenhouse: "Greenhouse (company sites)", lever: "Lever (company sites)",
  ashby: "Ashby (company sites)", workday: "Workday (company sites)", bayt: "Bayt", gulftalent: "GulfTalent",
  linkedin: "LinkedIn", remotive: "Remotive", remoteok: "RemoteOK", jobicy: "Jobicy"};

function renderCoverage(cov) {
  // Per-source health from the last run (grouped: one row per source, companies summed).
  const bySource = {};
  for (const s of cov.sources || []) {
    const g = bySource[s.source] ||= {kept: 0, failed: 0, units: 0, emptyUnits: []};
    g.kept += s.kept; g.failed += s.failed_requests + (s.crashed ? 1 : 0); g.units++;
    if (s.company && !s.kept) g.emptyUnits.push(s.company);
  }
  const health = g => !g ? "" : g.kept === 0 && g.failed > 0 ? "bad" : g.failed > 0 ? "warn" : "ok";
  const healthText = {ok: "working", warn: "partly failing", bad: "blocked / failing"};

  $("covSources").innerHTML = `<tr><th>Source</th><th>Status</th><th style="text-align:right">Jobs kept</th><th>Notes</th></tr>` +
    Object.entries(bySource).map(([name, g]) => {
      const h = health(g);
      const note = g.units > 1 ? `${g.units} companies` + (g.emptyUnits.length ? `, none matching today: ${g.emptyUnits.join(", ")}` : "") : "";
      return `<tr><td>${esc(SOURCE_NAMES[name] || name)}</td><td><span class="dot ${h}"></span>${healthText[h]}</td>
        <td class="num">${g.kept}</td><td class="sub">${esc(note)}</td></tr>`;
    }).join("");

  // Per-country job counts and which sources produced them.
  const boards = cov.board_countries || {};
  const countries = [...(cov.countries || [...new Set(jobs.map(j => j.target_country).filter(Boolean))])];
  const tiles = [["remote", "Remote"], ...countries.map(c => [c, c])].map(([key, label]) => {
    const list = jobs.filter(j => place(j) === key);
    const srcCount = {};
    list.forEach(j => srcCount[j.source] = (srcCount[j.source] || 0) + 1);
    const chips = Object.entries(srcCount).sort((a, b) => b[1] - a[1])
      .map(([s, n]) => `<span class="chip">${esc(s)} ${n}</span>`);
    for (const [b, cs] of Object.entries(boards)) {
      if (cs.includes(label) && !srcCount[b]) {
        const h = health(bySource[b]);
        chips.push(`<span class="chip ${h === "bad" ? "bad" : ""}">${esc(b)} ${h === "bad" ? "blocked" : "0"}</span>`);
      }
    }
    return {key, label, n: list.length, html: chips.join("")};
  });
  $("covCountries").innerHTML = tiles.map(t => `
    <button class="cty ${t.n ? "" : "zero"}" data-place="${esc(t.key)}">
      <div class="cty-top"><span>${esc(t.label)}</span><b>${t.n}</b></div>
      <div class="chips">${t.html || `<span class="chip">only company sites search here</span>`}</div>
    </button>`).join("");

  const active = tiles.filter(t => t.n).length;
  const blocked = Object.entries(bySource).filter(([, g]) => health(g) === "bad").map(([n]) => SOURCE_NAMES[n] || n);
  $("covSummary").textContent = `${countries.length} countries + remote · ${active} with jobs today` +
    (blocked.length ? ` · blocked: ${blocked.join(", ")}` : "");
}

$("covCountries").addEventListener("click", e => {
  const btn = e.target.closest(".cty");
  if (!btn) return;
  const sel = $("country");
  if (![...sel.options].some(o => o.value === btn.dataset.place)) return;  // no jobs there today
  sel.value = btn.dataset.place;
  showTab("jobs");
  window.scrollTo({top: 0, behavior: "smooth"});
});

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("err").textContent = "";
  $("unlockBtn").disabled = true;
  $("unlockBtn").textContent = "Unlocking…";
  try { await unlock($("pw").value, $("remember").checked); }
  catch (err) { $("err").textContent = err.message; }
  $("unlockBtn").disabled = false;
  $("unlockBtn").textContent = "Unlock";
});

$("logout").addEventListener("click", () => {
  try { sessionStorage.removeItem(PW_KEY); localStorage.removeItem(PW_KEY); } catch (e) {}
  location.reload();
});

$("csvBtn").addEventListener("click", async () => {
  try {
    const csv = await decryptFile("jobs.csv.enc", window.__pw);
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(new Blob([csv], {type: "text/csv"})), download: "jobs.csv"});
    a.click();
  } catch (e) { alert("Could not download CSV."); }
});

if (storedPw()) unlock(storedPw(), false).catch(() => {
  try { sessionStorage.removeItem(PW_KEY); localStorage.removeItem(PW_KEY); } catch (e) {}
});

["q","country","work","skill","status","reloc","hideRestricted","hideSkipped"].forEach(id => $(id).addEventListener("input", render));

function render() {
  const q = $("q").value.toLowerCase().trim();
  const passes = (j, ignoreSkill) => {
    const st = statusOf(j);
    if (q && !`${j.title} ${j.company} ${j.location} ${j.skills}`.toLowerCase().includes(q)) return false;
    if (!ignoreSkill && $("skill").value && !skillsOf(j).includes($("skill").value)) return false;
    if ($("country").value && place(j) !== $("country").value) return false;
    if ($("work").value && j.work_type !== $("work").value) return false;
    if ($("status").value && st !== $("status").value) return false;
    if ($("reloc").checked && !j.relocation_or_visa) return false;
    if ($("hideRestricted").checked && (j.citizens_only || j.no_sponsorship || j.remote_restricted)) return false;
    if ($("hideSkipped").checked && st === "skip" && $("status").value !== "skip") return false;
    return true;
  };
  const shown = jobs.filter(j => passes(j));
  if (activeTab === "skills") renderSkills(jobs.filter(j => passes(j, true)));

  const count = s => jobs.filter(j => statusOf(j) === s).length;
  $("stats").innerHTML = [
    [shown.length, "matching filters"],
    [jobs.filter(j => j.first_seen === today).length, "new today"],
    [jobs.filter(j => j.relocation_or_visa && !j.no_sponsorship).length, "mention relocation/visa"],
    [count("applied"), "applied"],
    [count("interview"), "interviews"],
  ].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  if (!shown.length) { $("list").innerHTML = `<div class="empty">No jobs match these filters.</div>`; return; }

  $("list").innerHTML = shown.slice(0, 400).map((j, i) => {
    const st = statusOf(j);
    const chips = [
      `<span class="chip">${esc(j.work_type)}</span>`,
      j.first_seen === today ? `<span class="chip good">new</span>` : "",
      j.relocation_or_visa && !j.no_sponsorship ? `<span class="chip good">relocation / visa</span>` : "",
      j.no_sponsorship ? `<span class="chip bad">no sponsorship</span>` : "",
      j.citizens_only ? `<span class="chip bad">citizens only</span>` : "",
      j.remote_restricted ? `<span class="chip warn">${esc(j.remote_restricted)}</span>` : "",
      j.other_language ? `<span class="chip warn">needs ${esc(j.other_language)}</span>` : "",
      j.link_type === "listing" ? `<span class="chip">via ${esc(j.source)}</span>` : `<span class="chip">direct apply</span>`,
    ].join("");
    return `<article class="job ${st === "skip" || st === "rejected" ? "dim" : ""}" data-i="${i}">
      <div class="score ${+j.score >= 10 ? "hi" : ""}" title="match score">${esc(j.score)}</div>
      <div>
        <a class="title" href="${esc(j.apply_url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
        <div class="meta">${esc(j.company)} · ${esc(j.location || "—")}${j.posted ? " · " + esc(j.posted) : ""}</div>
        <div class="chips">${chips}</div>
        ${j.skills ? `<div class="meta" style="margin-top:6px">Skills: ${skillsOf(j).map(s =>
          (skillsMeta.mine || []).includes(s) ? `<b>✓ ${esc(s)}</b>` : esc(s)).join(" · ")}</div>` : ""}
        ${j.description ? `<button class="more">Show summary</button><div class="desc">${esc(j.description)}…</div>` : ""}
      </div>
      <div class="side">
        <a class="btn" href="${esc(j.apply_url)}" target="_blank" rel="noopener">Apply ↗</a>
        <select data-url="${esc(j.apply_url)}">${STATUSES.map(s => `<option ${s === st ? "selected" : ""}>${s}</option>`).join("")}</select>
      </div>
    </article>`;
  }).join("");
}

$("list").addEventListener("change", e => {
  if (e.target.matches("select[data-url]")) {
    statusMap[e.target.dataset.url] = e.target.value;
    saveStatus();
    render();
  }
});
$("list").addEventListener("click", e => {
  if (e.target.matches(".more")) {
    const job = e.target.closest(".job");
    job.classList.toggle("open");
    e.target.textContent = job.classList.contains("open") ? "Hide summary" : "Show summary";
  }
});
</script>
</body>
</html>
